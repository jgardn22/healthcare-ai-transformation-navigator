name: Navigator source review checks

on:
  schedule:
    - cron: '0 15 * * 1'
    - cron: '0 15 1-3 * *'
  workflow_dispatch:
    inputs:
      review_kind:
        description: Review requested
        type: choice
        options: [weekly, monthly, announcement]
        default: announcement
      announcement_url:
        description: Official announcement URL for event-driven review
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: navigator-source-checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify requested review
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REVIEW_KIND: ${{ inputs.review_kind }}
          ANNOUNCEMENT_URL: ${{ inputs.announcement_url }}
        run: node tools/review-cadence.mjs
      - name: Check public content and tests
        if: steps.cadence.outputs.run == 'true'
        run: |
          node --test tools/*.test.mjs
          node tools/check-navigator.mjs
          node tools/check-navigator.mjs --links
      - name: Inventory upstream candidates without promotion
        if: steps.cadence.outputs.run == 'true'
        run: node tools/sync-aibast.mjs
