name: Sync AIBAST healthcare use cases

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aibast-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull healthcare use cases from the AIBAST Agents Library
        id: sync
        run: node tools/sync-aibast.mjs

      - name: Open or update a pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.sync.outputs.body }}
        run: |
          branch=aibast-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add aibast.js index.html
          git commit -m "Sync healthcare use cases from the AIBAST Agents Library"
          git push --force origin "$branch"
          printf '%s\n\nGenerated by tools/sync-aibast.mjs. Review the new cards, confirm the line-of-business placement, then merge to publish.\n' "$BODY" > pr-body.md
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$branch" --title "New healthcare use cases from the AIBAST Agents Library" --body-file pr-body.md
          else
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" --title "New healthcare use cases from the AIBAST Agents Library" --body-file pr-body.md
          fi
